name: macro_pulse
description: Free #3 — Macro Pulse. Morning market weather in 5 cards. Education only.
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  intl: ^0.20.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: assets/branding/app_icon_fg.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B1220"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#0B1220"
    image: assets/branding/splash_logo.png
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/
    - assets/data/live_snapshot.json
