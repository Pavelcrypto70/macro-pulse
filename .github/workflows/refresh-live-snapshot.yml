name: Refresh live snapshot

on:
  schedule:
    - cron: "30 11 * * 1-5" # ~11:30 UTC weekdays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public macro series
        run: python tool/fetch_live_snapshot.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/live_snapshot.json web/data/live_snapshot.json
          if git diff --staged --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "chore: refresh Macro Pulse live snapshot"
            git push
          fi
